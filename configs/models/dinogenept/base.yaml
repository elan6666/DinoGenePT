ablation:
  dino: true
  delta_ibot: true
  dynamic_locals: true
  local_sources: [go, protein, pathway, hpa]
  source_control: none
  ibot_target_control: none
  koleo_weight: 0.0
  situ_glu_backbone: false
  attention_residual:
    enabled: false
    block_size: 4
  kda:
    enabled: false
    global_every: 4
  adapter:
    type: none
    top_layers: 4
    latent_dim: 128
    experts: 8
    top_k: 2
    balance: auxiliary
    situ_glu: false

training:
  phase: finetune
  epochs: 15
  batch_size: 8
  bag_size: 4
  seed: 1
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 0.0
  lr_gamma: 0.9
  gradient_clip: 1.0
  amp_bfloat16: true
  max_batches: 0
  max_validation_batches: 0
  selection_metric: validation_prediction_mse
  losses:
    prediction: mse
    prediction_weight: 1.0
    direction_weight: 0.5
    dino_weight: 0.5
    local_dino_weight: 0.5
    ibot_weight: 0.5
    moe_balance_weight: 0.01

evaluation:
  name: perturbation
  normalization: none
  protocol_id: gears-condition-macro-v1
  split: test
  seed: 20260824
  control_samples: 300
  batch_size: 64
  energy_distance: true
  energy_max_samples: 64
  bootstrap_resamples: 1000
  bootstrap_seed: 20260824

runtime:
  device: cuda:0
  output_root: ${DINOGENEPT_OUTPUT_ROOT:-results/dinogenept}
  enforce_server: true
  required_work_root: /data/yilangliu/GenePT-Seed
  required_cuda_visible_devices: "0"
  smoke: false
  save_checkpoint: true
  max_gpu_memory_fraction: 0.90
  min_free_gpu_mb: 30000
  permutation_tolerance: 0.00001
  tracking:
    provider: trackio
    enabled: ${DINOGENEPT_TRACKIO_ENABLED:-false}
    project: ${DINOGENEPT_TRACKIO_PROJECT:-dinogenept-ablation}
    space_id: ${DINOGENEPT_TRACKIO_SPACE_ID:-}
    sync_space_id: ${DINOGENEPT_TRACKIO_SYNC_SPACE_ID:-elan68681/dinogenept-ablation}
    local_dir: ${DINOGENEPT_TRACKIO_DIR:-.runtime/trackio-data}
    private: true
    auto_log_gpu: true
    auto_log_cpu: true
