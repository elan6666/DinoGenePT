identity:
  model_id: dinogenept

model:
  name: dinogenept
  d_model: 512
  layers: 12
  heads: 8
  # scGPT Nature Methods implementation details: 512 embedding/hidden width,
  # 12 Transformer blocks, 8 heads, and a 512-wide feed-forward layer.
  ff_dim: 512
  dropout: 0.1
  max_seq_len: 1200
  positional_embedding: false
  pretrained_checkpoint: null
  pretrained_minimum_match_fraction: 0.9
  pretrained_strict: false
  dino_head:
    hidden_dim: 2048
    bottleneck_dim: 256
    prototypes: 4096
  dino:
    student_temperature: 0.1
    teacher_temperature_start: 0.04
    teacher_temperature_end: 0.07
    ema_start: 0.996
    center_momentum: 0.9
  mask:
    gene_selection: train_variance
    sample_probability: 0.5
    ratio: [0.1, 0.5]
    noise_std: 0.01

priors:
  base:
    path: ${DINOGENEPT_BASE_PRIOR:-data/embeddings/dinogenept/base-targets.npz}
    manifest: ${DINOGENEPT_BASE_PRIOR_MANIFEST:-data/embeddings/dinogenept/base-targets.npz.manifest.json}
    profile: ncbi-uniprot-base-v1
    source_manifest: data/corpora/seed-master.manifest.json
