training:
  phase: finetune
  epochs: 15
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 0.0
  lr_gamma: 0.9
  selection_metric: validation_prediction_mse

model:
  pretrained_minimum_match_fraction: 1.0
  pretrained_strict: true

ablation:
  dino: false
  delta_ibot: false
  dynamic_locals: false
  local_sources: []
  koleo_weight: 0.0

identity:
  experiment_id: scgpt-aligned-finetune
