[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dinogenept"
version = "0.1.0"
description = "DinoGenePT research toolkit with auditable GenePT knowledge embeddings."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DinoGenePT contributors"}]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
training = [
  "torch>=2.6",
  "anndata>=0.11",
  "h5py>=3.12",
  "pandas>=2.2",
  "pyarrow>=17",
  "scanpy>=1.11",
]
census = ["cellxgene-census>=1.17"]
dev = [
  "build>=1.2",
  "hatchling>=1.26",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
dinogenept = "dinogenept.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dinogenept"]

[tool.hatch.build]
exclude = [
  "/.venv",
  "/.runtime",
  "/.env",
  "/.env.*",
  "/uv.lock",
  "**/.DS_Store",
  "/data",
  "/results",
  "/checkpoints",
  "/dist",
  "/build",
  "/.pytest_cache",
  "/.ruff_cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
  ".runtime",
  "data",
  "results",
  "checkpoints",
  "dist",
  "build",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
